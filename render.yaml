services:
  - type: web
    name: hawkins-homestay
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --omit=dev
    startCommand: cd backend && node scripts/seedCatalog.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
