<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Password recovery | Hawkins Homestay</title>
    <style>
        body { font: 1rem/1.5 system-ui, sans-serif; margin: 0; background: #f3f4ef; color: #172b23; }
        main { box-sizing: border-box; width: min(100% - 2rem, 30rem); margin: 12vh auto; padding: 2rem; background: white; border-radius: .75rem; }
        form, label { display: grid; gap: .65rem; }
        input, button { font: inherit; padding: .65rem; }
        button { background: #214d3b; color: white; border: 0; border-radius: .25rem; }
        a { color: #214d3b; }
    </style>
</head>
<body>
    <main>
        <a href="/login/login.html">Back to sign in</a>
        <h1 id="recovery-title">Reset your password</h1>
        <form id="request-reset">
            <label>Email address <input name="email" type="email" autocomplete="email" required></label>
            <button type="submit">Email me a reset link</button>
        </form>
        <form id="complete-reset" hidden style="display: none">
            <label>New password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
            <button type="submit">Save new password</button>
        </form>
        <p id="recovery-status" role="status" aria-live="polite"></p>
    </main>
    <script src="/js/site.js"></script>
    <script src="recovery.js"></script>
</body>
</html>
